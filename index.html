<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThinkPad Reboot Logo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #ef4444;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #020617, var(--bg));
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        width: min(90vw, 720px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 2rem;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      img {
        display: block;
        width: min(100%, 420px);
        height: auto;
        margin: 0 auto 1.5rem;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.5rem, 3vw, 2.5rem);
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
      }

      .download-button {
        display: inline-block;
        padding: 0.8rem 1.2rem;
        border-radius: 999px;
        background: var(--accent);
        color: white;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .download-button:hover,
      .download-button:focus-visible {
        transform: translateY(-1px);
        opacity: 0.96;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="./logo.svg" alt="ThinkPad-inspired reboot logo" />
      <h1>ThinkPad Reboot Logo</h1>
      <p>Download the SVG asset below.</p>
      <a class="download-button" href="./logo.svg" download="thinkpad-reboot-logo.svg">Download SVG</a>
    </main>
  </body>
</html>
